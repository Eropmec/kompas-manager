name: Сборка exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Тесты
        shell: bash
        run: |
          set +e
          python -m pytest -q tests -rfE --tb=line > pytest.txt 2>&1
          code=$?
          cat pytest.txt
          if [ $code -ne 0 ]; then
            grep -E "^(FAILED|ERROR)|^[A-Za-z]:\\.*:[0-9]+: |^E  " pytest.txt | head -30 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $code

      - name: Проверка импорта модулей
        run: |
          python -c "import kompas_manager.ui.main_window, kompas_manager.scanner; print('manager ok')"
          cd proto
          python -c "import naming, report, app; print('proto ok')"

      - name: Сборка менеджера
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name KompasManager
          --icon assets/app.ico
          --add-data "assets/app_256.png;assets"
          --paths .
          --hidden-import kompas_manager.kompas_api
          --hidden-import kompas_manager.ui.workers
          --hidden-import kompas_manager.ui.library_dialogs
          --hidden-import kompas_manager.library_ops
          --hidden-import kompas_manager.structure_ops
          --hidden-import kompas_manager.ui.structure_dialog
          --hidden-import kompas_manager.editing_ops
          --hidden-import kompas_manager.ui.versions_dialog
          --hidden-import kompas_manager.autonomy_ops
          --hidden-import kompas_manager.ui.source_panel
          --hidden-import openpyxl
          run_manager.py

      - name: Сборка прототипа
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name KompasProto
          --icon assets/app.ico
          --paths proto
          --hidden-import probe
          --hidden-import rename_test
          --hidden-import kompas
          --hidden-import lib_test
          --hidden-import copy_test
          proto/app.py


      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: |
            KompasManager.exe — менеджер проектов.
            KompasProto.exe — прототип проверки API.
            Коммит ${{ github.sha }}
          files: |
            dist/KompasManager.exe
            dist/KompasProto.exe
          make_latest: true
